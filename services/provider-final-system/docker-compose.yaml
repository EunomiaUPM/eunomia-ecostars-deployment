name: ecostars-provider-stack

services:
  postgres:
    container_name: postgres
    image: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "10000:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  static-api:
    container_name: static-api
    build: ./inner
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ecostars
      KEYCLOAK_CLIENT_ID: ecostars-client
    command: "serve"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - static-api-setup
      - keycloak

  static-api-setup:
    container_name: static-api-setup
    build: ./inner
    env_file:
      - .env
    command: "fake"
    depends_on:
      - postgres

  dynamic-api:
    container_name: dynamic-api
    build: ./inner
    ports:
      - "8082:8082"
    env_file:
      - .env
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ecostars
      KEYCLOAK_CLIENT_ID: ecostars-client
    command: ["metrics"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - keycloak

  keycloak-db:
    container_name: keycloak-db
    image: postgres:15
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    volumes:
      - keycloak_data:/var/lib/postgresql/data

  keycloak:
    container_name: keycloak
    image: quay.io/keycloak/keycloak:26.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8083:8080"
    volumes:
      - ./config/keycloak/fast-setup-realm.json:/opt/keycloak/data/import/realm.json
    depends_on:
      - keycloak-db

volumes:
  pgdata:
  keycloak_data:
