name: Deploy

# Prod only. The standalone deployment runs every participant on one host,
# so there is nothing to spread over three servers: run `./eunomia up` there.

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  HEIMDALL_COMPOSE: deployment/prod/docker-compose.heimdall.yaml
  PROVIDER_COMPOSE: deployment/prod/docker-compose.provider.yaml
  CONSUMER_COMPOSE: deployment/prod/docker-compose.consumer.yaml

jobs:
  # ──────────────────────────────────────────────
  # Machine A — Heimdall (Authority)
  # Must complete before Provider and Consumer
  # ──────────────────────────────────────────────
  deploy-heimdall:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - name: Deploy Heimdall via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HEIMDALL_HOST }}
          username: ${{ secrets.HEIMDALL_USER }}
          key: ${{ secrets.HEIMDALL_SSH_KEY }}
          port: ${{ secrets.HEIMDALL_SSH_PORT || 22 }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"

            echo "==> Updating repository"
            git fetch origin main
            git reset --hard origin/main

            echo "==> Authenticating with quay.io"
            echo "${{ secrets.QUAY_PASSWORD }}" | \
              docker login quay.io -u "${{ secrets.QUAY_USER }}" --password-stdin

            echo "==> Pulling the pinned images"
            docker compose -f ${{ env.HEIMDALL_COMPOSE }} pull

            echo "==> Starting Heimdall"
            docker compose -f ${{ env.HEIMDALL_COMPOSE }} up -d --wait --remove-orphans

            echo "==> Stack status"
            docker compose -f ${{ env.HEIMDALL_COMPOSE }} ps

  # ──────────────────────────────────────────────
  # Machine B — Provider
  # ──────────────────────────────────────────────
  deploy-provider:
    runs-on: ubuntu-latest
    needs: deploy-heimdall
    environment: prod
    steps:
      - name: Deploy Provider via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROVIDER_HOST }}
          username: ${{ secrets.PROVIDER_USER }}
          key: ${{ secrets.PROVIDER_SSH_KEY }}
          port: ${{ secrets.PROVIDER_SSH_PORT || 22 }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"

            echo "==> Updating repository"
            git fetch origin main
            git reset --hard origin/main

            echo "==> Authenticating with quay.io"
            echo "${{ secrets.QUAY_PASSWORD }}" | \
              docker login quay.io -u "${{ secrets.QUAY_USER }}" --password-stdin

            echo "==> Pulling the pinned images"
            docker compose -f ${{ env.PROVIDER_COMPOSE }} pull

            echo "==> Starting Provider"
            docker compose -f ${{ env.PROVIDER_COMPOSE }} up -d --wait --remove-orphans

            echo "==> Stack status"
            docker compose -f ${{ env.PROVIDER_COMPOSE }} ps

  # ──────────────────────────────────────────────
  # Machine C — Consumer DS-Agent + Client Stack
  # ──────────────────────────────────────────────
  deploy-consumer:
    runs-on: ubuntu-latest
    needs: deploy-heimdall
    environment: prod
    steps:
      - name: Deploy Consumer DS-Agent via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CONSUMER_HOST }}
          username: ${{ secrets.CONSUMER_USER }}
          key: ${{ secrets.CONSUMER_SSH_KEY }}
          port: ${{ secrets.CONSUMER_SSH_PORT || 22 }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"

            echo "==> Updating repository"
            git fetch origin main
            git reset --hard origin/main

            echo "==> Authenticating with quay.io"
            echo "${{ secrets.QUAY_PASSWORD }}" | \
              docker login quay.io -u "${{ secrets.QUAY_USER }}" --password-stdin

            echo "==> Pulling the pinned images"
            docker compose -f ${{ env.CONSUMER_COMPOSE }} pull

            echo "==> Starting Consumer DS-Agent"
            docker compose -f ${{ env.CONSUMER_COMPOSE }} up -d --wait --remove-orphans

            echo "==> Stack status"
            docker compose -f ${{ env.CONSUMER_COMPOSE }} ps

      - name: Deploy Consumer Client Stack via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.CONSUMER_HOST }}
          username: ${{ secrets.CONSUMER_USER }}
          key: ${{ secrets.CONSUMER_SSH_KEY }}
          port: ${{ secrets.CONSUMER_SSH_PORT || 22 }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}/services/consumer-client-stack"

            echo "==> Pulling latest images (NiFi, Metabase, Postgres)"
            docker compose pull

            echo "==> Starting Consumer Client Stack"
            docker compose up -d --remove-orphans

            echo "==> Stack status"
            docker compose ps
