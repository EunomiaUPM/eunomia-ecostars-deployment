# ==========================
# COMMON ANCHORS
# ==========================
http_host: &http_host
  protocol: 'https'
  url: 'your_domain'
  port: null
  internal_port: '1500'

# ==========================
# CONFIG
# ==========================

hosts_config:
  http: *http_host
  grpc: null
  graphql: null

connection_config:
  is_prod: true
  is_vault_real: true
  has_tls_proxy: true

db_config:
  db_type: Postgres
  url: 'heimdall-db'
  port: '5432'

wallet_config:
  wallet: Fafnir
  api:
    http:
      protocol: 'http'
      url: 'heimdall-fafnir-wallet'
      port: '7001'
      internal_port: null
    grpc: null
    graphql: null

did_config:
  type: Web
  domain: 'your_domain'
  path: null
  port: null

role: EcoAuthority

api_config:
  version: 'v1'
  openapi_path: '/app/static/specs/openapi/openapi.json'

issue_config:
  ds_config:
    dataspace_id: 'change_me'
  clh_config:
    label_level: 'SC'
    engine_version: '2.11.0'
    rules_version: 'CD25.10'
    validated_criteria: 'https://docs.gaia-x.eu/policy-rules-committee/compliance-document/25.10/criteria_participant/#PA1.1'

verify_req_config:
  is_cert_allowed: true
  auto_approve_cert: true
  vcs_requested: ['gx:VatId', 'gx:LegalPerson', 'gx:TermsAndConditions']

is_react: true
