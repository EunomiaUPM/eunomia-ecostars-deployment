name: ecostars-provider

services:
  provider-db:
    container_name: ecostars-provider-db
    image: "postgres"
    restart: always
    env_file:
      - ./../../static/envs/provider/db.env.example
    ports:
      - "1400:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mini_provider"]
      interval: 10s
      retries: 10

  provider-redis:
    image: redis:alpine
    restart: always
    container_name: ecostars-provider-redis
    ports:
      - "6379:6379"
    command: >
      redis-server  --requirepass ds_core_provider_redis --user admin on
      >ds_core_provider_redis ~* +@all

  # =========================
  # Fafnir wallet
  # =========================
  provider-fafnir-setup:
    container_name: ecostars-provider-fafnir-setup
    image: rmenendez8/fafnir:v0.2.0
    platform: linux/amd64
    depends_on:
      provider-db:
        condition: service_healthy
    volumes:
      - ./../../static/config/provider/mini/fafnir.provider.yaml:/app/static/fafnir/config.yaml
      - ./../../vault/provider/secrets/db.json.example:/app/vault/secrets/db.json.example
    env_file:
      - ./../../static/envs/provider/fafnir.env.example
    environment:
      RUST_BACKTRACE: 1
    command: ["setup", "--env-file", "/app/static/fafnir/config.yaml"]
    restart: "no"

  provider-fafnir-wallet:
    container_name: ecostars-provider-fafnir-wallet
    image: rmenendez8/fafnir:v0.2.0
    platform: linux/amd64
    restart: always
    depends_on:
      provider-fafnir-setup:
        condition: service_completed_successfully
    volumes:
      - ./../../static/config/provider/mini/fafnir.provider.yaml:/app/static/fafnir/config.yaml
      - ./../../vault/provider/secrets/db.json.example:/app/vault/secrets/db.json.example
    env_file:
      - ./../../static/envs/provider/fafnir.env.example
    environment:
      RUST_BACKTRACE: 1
    command: ["start", "--env-file", "/app/static/fafnir/config.yaml"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:7001/readiness"]
      interval: 10s
      timeout: 2s
      retries: 10
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # =========================
  # Setup job (one-shot)
  # =========================
  provider-setup:
    container_name: ecostars-provider-setup
    image: quay.io/eunomia_upm/ds-agent:dev-22f38ce
    platform: linux/amd64
    command: ["setup", "-e", "/app/static/config/mini.provider.yaml"]
    volumes:
      - ./../../static/config/provider/mini:/app/static/config
      - ./../../static/specs/agent:/app/static/specs
      - ./../../static/policy_templates:/app/static/policy_templates
      - ./../../vault/provider:/app/vault
    depends_on:
      - provider-db
      - provider-redis
    env_file:
      - ./../../static/envs/provider/core.env.example
    restart: "no"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # =========================
  # Main service
  # =========================
  provider:
    container_name: ecostars-provider
    image: quay.io/eunomia_upm/ds-agent:dev-22f38ce
    platform: linux/amd64
    command: ["start", "-e", "/app/static/config/mini.provider.yaml"]
    ports:
      - "1200:1200"
    volumes:
      - ./../../static/config/provider/mini:/app/static/config
      - ./../../static/specs/agent:/app/static/specs
      - ./../../static/policy_templates:/app/static/policy_templates
      - ./../../vault/provider:/app/vault
    depends_on:
      provider-setup:
        condition: service_completed_successfully
      provider-db:
        condition: service_started
      provider-redis:
        condition: service_started
      provider-fafnir-wallet:
        condition: service_healthy
    env_file:
      - ./../../static/envs/provider/core.env.example
    environment:
      RUST_BACKTRACE: full
    extra_hosts:
      - "host.docker.internal:host-gateway"
